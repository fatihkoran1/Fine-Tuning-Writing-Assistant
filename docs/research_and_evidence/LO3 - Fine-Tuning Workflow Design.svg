<svg width="100%" viewBox="0 0 1110 1130" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Structured fine-tuning pipeline for a low-resource writing assistant</title>
<desc>Pipeline showing cleaned dataset, candidate model selection, baseline testing, fine-tuning, after testing, comparison, final model decision, and demo.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L0,6 L7,3 z" fill="#374151" />
</marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
</filter>
</defs>
<rect x="0" y="0" width="1110" height="1130" fill="#FBFCFE"/>
<text x="555" y="48" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Structured Fine-Tuning Pipeline</text>
<text x="555" y="78" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563">Low-resource writing assistant — compare baseline vs fine-tuned behavior</text>
<rect x="175" y="98" width="760" height="42" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="555" y="125" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#374151">Model names are examples only. The final choice will be based on test evidence.</text>
<rect x="150" y="145" width="810" height="82" rx="18" fill="#EAF3FF" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="178" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">1. Cleaned dataset</text>
<text x="180" y="204" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Use the cleaned dataset and keep train / validation / test split.</text>
<line x1="555" y1="236" x2="555" y2="250" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="150" y="263" width="810" height="82" rx="18" fill="#F1F8E9" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="296" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">2. Choose candidate models</text>
<text x="180" y="322" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Select 2–3 small models. Examples only: GPT-2 small, BLOOM, SmolLM.</text>
<rect x="818" y="287" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="876.0" y="310" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">LO1 / LO2</text>
<line x1="555" y1="354" x2="555" y2="368" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="150" y="381" width="810" height="82" rx="18" fill="#FFF8E1" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="414" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">3. Test without fine-tuning</text>
<text x="180" y="440" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Use the same prompts and save baseline results for each model.</text>
<rect x="818" y="405" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="876.0" y="428" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">LO4</text>
<line x1="555" y1="472" x2="555" y2="486" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="150" y="499" width="810" height="82" rx="18" fill="#EDE7F6" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="532" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">4. Fine-tune selected models</text>
<text x="180" y="558" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Use LoRA first. Use QLoRA only if the model is too heavy.</text>
<rect x="818" y="523" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="876.0" y="546" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">LO3 / LO4</text>
<line x1="555" y1="590" x2="555" y2="604" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="150" y="617" width="810" height="82" rx="18" fill="#E0F2F1" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="650" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">5. Test after fine-tuning</text>
<text x="180" y="676" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Use the same prompts again and save generated suggestions.</text>
<rect x="818" y="641" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="876.0" y="664" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">LO4</text>
<line x1="555" y1="708" x2="555" y2="722" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="150" y="735" width="810" height="82" rx="18" fill="#FFF3E0" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="768" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">6. Compare before vs after</text>
<text x="180" y="794" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Check useful output, bad output, copied output, and improvement.</text>
<rect x="818" y="759" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="876.0" y="782" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">LO5</text>
<line x1="555" y1="826" x2="555" y2="840" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="150" y="853" width="810" height="82" rx="18" fill="#FCE4EC" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="886" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">7. Choose final model + method</text>
<text x="180" y="912" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Decide based on evidence: quality, memorization risk, and generalization.</text>
<rect x="818" y="877" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="876.0" y="900" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">LO2 / LO5</text>
<line x1="555" y1="944" x2="555" y2="958" stroke="#374151" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="150" y="971" width="810" height="82" rx="18" fill="#F3E5F5" stroke="#D1D5DB" stroke-width="1.4" filter="url(#shadow)"/>
<text x="180" y="1004" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">8. Build small demo / website</text>
<text x="180" y="1030" text-anchor="start" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#374151">Text input + generated suggestion output for the writing assistant.</text>
<rect x="818" y="995" width="116" height="34" rx="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="876.0" y="1018" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2937">LO3 / LO4</text>
<path d="M 970 776.0 C 1052 776.0, 1052 304.0, 970 304.0" fill="none" stroke="#6B7280" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
<text x="1018" y="540.0" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#6B7280">adjust if needed</text>
</svg>